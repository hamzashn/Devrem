[workspace]
resolver = "3"
members = [
    "crates/devrem-core",
    "crates/devrem-components",
    "crates/devrem-sim",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["HamzaShn"]
license = "MIT"
publish = false

[workspace.dependencies]
devrem-core = { path = "crates/devrem-core" }
devrem-components = { path = "crates/devrem-components" }
devrem-sim = { path = "crates/devrem-sim" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
