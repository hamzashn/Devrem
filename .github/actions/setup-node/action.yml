name: Node + pnpm kurulumu
description: pnpm ve Node.js kurar, bağımlılıkları yükler.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
